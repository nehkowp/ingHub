<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercice4</title>
</head>
<body>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
    const div = document.createElement('div');
    div.id = 'divTP4';
    
    const form = document.createElement('form');
    form.enctype = 'multipart/form-data';
    form.method = 'post';
    form.action = 'upload.php';
    
    const fieldset = document.createElement('fieldset');
    
    const legend = document.createElement('legend');
    legend.textContent = 'Uploader une image';
    
    const innerDiv = document.createElement('div');
    innerDiv.style.textAlign = 'center';
    
    const label = document.createElement('label');
    label.htmlFor = 'inputUpload';
    label.textContent = 'Image à uploader :';
    
    const input = document.createElement('input');
    input.type = 'file';
    input.name = 'inputUpload';
    input.id = 'inputUpload';
    
    const br1 = document.createElement('br');
    const br2 = document.createElement('br');
    
    const submitInput = document.createElement('input');
    submitInput.type = 'submit';
    submitInput.value = 'Envoyer';
    
    innerDiv.appendChild(label);
    innerDiv.appendChild(input);
    innerDiv.appendChild(br1);
    innerDiv.appendChild(br2);
    innerDiv.appendChild(submitInput);
    
    fieldset.appendChild(legend);
    fieldset.appendChild(innerDiv);
    
    form.appendChild(fieldset);
    div.appendChild(form);
    
    document.body.appendChild(div);
});
       </script>
</body>
</html>
