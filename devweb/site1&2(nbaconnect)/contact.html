<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBAConnect - Contact</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="img/ico.png" type="image/png">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="banner">
                <img src="img/logo.jpg" alt="Logo NBAConnect" class="logo">
                <div class="site-title">
                    <h1>NBAConnect</h1>
                </div>
                <div class="login-area">
                    <form action="#" method="post" class="login-form">
                        <input type="text" placeholder="Identifiant" required>
                        <input type="password" placeholder="Mot de passe" required>
                        <button type="submit">Connexion</button>
                    </form>
                </div>
            </div>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Accueil</a></li>
                    <li><a href="meneurs.html">Meneurs</a></li>
                    <li><a href="arrieres.html">Arrières</a></li>
                    <li><a href="interieurs.html">Intérieurs</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>
            </nav>
        </header>

        <div class="content-wrapper">
            <!-- Side Menu -->
            <aside class="side-menu">
                <h2>NBAConnect</h2>
                <ul>
                    <li><a href="index.html">Accueil</a></li>
                    <li><h3>Nos joueurs</h3>
                        <ul>
                            <li><a href="meneurs.html">Meneurs</a></li>
                            <li><a href="arrieres.html">Arrières</a></li>
                            <li><a href="interieurs.html">Intérieurs</a></li>
                            <li><a href="contact.html" class="active">Contact</a></li>
                        </ul>
                    </li>
                </ul>
            </aside>

            <!-- Main Content -->
            <main class="main-content">
                <h2>Demande de contact</h2>
                <form action="#" method="post" class="contact-form" id="contact-form">
                    <div class="form-group">
                        <label for="contact-date">Date du contact</label>
                        <input type="date" id="contact-date" name="contact-date" required>
                    </div>
                    <div class="form-group">
                        <label for="nom">Nom</label>
                        <input type="text" id="nom" name="nom" required>
                    </div>
                    <div class="form-group">
                        <label for="prenom">Prénom</label>
                        <input type="text" id="prenom" name="prenom" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label>Genre</label>
                        <div class="radio-group">
                            <label>
                                <input type="radio" name="genre" value="femme" checked> Femme
                            </label>
                            <label>
                                <input type="radio" name="genre" value="homme"> Homme
                            </label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="date-naissance">Date de Naissance</label>
                        <input type="date" id="date-naissance" name="date-naissance" required>
                    </div>
                    <div class="form-group">
                        <label for="fonction">Profil</label>
                        <select id="fonction" name="fonction" required>
                            <option value="">Sélectionnez votre profil</option>
                            <option value="fan">Fan</option>
                            <option value="joueur">Joueur</option>
                            <option value="coach">Coach</option>
                            <option value="scout">Recruteur</option>
                            <option value="journaliste">Journaliste</option>
                            <option value="autre">Autre</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="sujet">Sujet</label>
                        <input type="text" id="sujet" name="sujet" required>
                    </div>
                    <div class="form-group">
                        <label for="contenu">Message</label>
                        <textarea id="contenu" name="contenu" rows="6" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Envoyer</button>
                </form>
            </main>
        </div>

        <!-- Footer -->
        <footer>
            <p>Copyright NBAConnect</p>
            <p>Webmaster CY Tech</p>
        </footer>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
